<!DOCTYPE html>
<html>
<head>
  <style>
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
}

.container {
  background: white;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  width: 400px;
}

input {
  width: 70%;
  padding: 10px;
  border: 2px solid #667eea;
  border-radius: 8px;
  outline: none;
}

button {
  padding: 10px 15px;
  background: #667eea;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #764ba2;
}

li {
  background: #f5f5f5;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  list-style: none;
}
</style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>My Todo List</h2>
  <input id="taskInput" placeholder="Add new task">
  <button onclick="addTask()">Add</button>
  <ul id="taskList"></ul>
  <script src="script.js"></script>
</body>
</html>
